<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - BlogHub</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/stylesheet.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <header class="site-header">
      <nav
        class="navbar flex items-center justify-between px-6 md:px-12 lg:px-16"
      >
        <!-- Logo -->
        <a href="index.html" class="logo flex items-center gap-3">
          <span class="logo-box"> B </span>

          <span class="logo-text"> BlogHub </span>
        </a>

        <!-- Navigation Links -->
        <div class="nav-links hidden md:flex items-center gap-10">
          <a href="index.html" class="active"> Home </a>

          <a href="explore.html"> Explore </a>
        </div>
      </nav>
    </header>

    <main class="login-page">
      <div class="login-container">
        <div class="login-box">
          <h1>Welcome Back!</h1>
          <p class="subtitle">Login to continue to BlogHub</p>

          <form action="#" method="POST">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="login-options">
              <label>
                <input type="checkbox" name="remember" />
                Remember me
              </label>

              <a href="#">Forgot Password?</a>
            </div>

            <!-- Login Button -->
            <button type="submit" class="login-btn">Login</button>
          </form>

          <p class="register-text">
            Don't have an account?
            <a href="register.html">Register</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
