<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - BlogHub</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/stylesheet.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="bg-gray-50 text-gray-800">

    <header class="site-header">
        <nav class="navbar flex items-center justify-between px-6 md:px-12 lg:px-16 py-5 bg-white border-b border-gray-100">

            <a href="index.html" class="logo flex items-center gap-3">
                <span class="logo-box flex items-center justify-center w-10 h-10 rounded-lg bg-orange-500 text-white font-bold text-xl">
                    B
                </span>

                <span class="logo-text text-2xl font-bold">
                    BlogHub
                </span>
            </a>

            <div class="nav-links hidden md:flex items-center gap-10">
                <a href="index.html" class="active text-gray-700 font-medium hover:text-orange-500">
                    Home
                </a>

                <a href="explore.html" class="text-gray-700 font-medium hover:text-orange-500">
                    Explore
                </a>
            </div>

            <div class="nav-actions flex items-center gap-4">
                <a href="login.html" class="px-5 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:border-gray-400">
                    Log In
                </a>

                <a href="register.html" class="px-5 py-2.5 rounded-lg bg-amber-600 text-white font-medium hover:bg-amber-700">
                    Get Started
                </a>
            </div>

        </nav>
    </header>

    <main class="login-page min-h-[calc(100vh-81px)] flex items-center justify-center px-4 py-12">

        <div class="login-container w-full max-w-md">

            <div class="login-box bg-white rounded-2xl shadow-lg border border-gray-100 px-8 py-10 md:px-10">

                <h1 class="text-3xl md:text-4xl font-bold text-center mb-2">
                    Welcome back
                </h1>

                <p class="subtitle text-gray-500 text-center mb-8">
                    Sign in to your BlogHub account to continue your journey.
                </p>

                <form action="#" method="POST">

                    <div class="form-group mb-5">
                        <label for="email" class="block text-sm font-semibold mb-2">
                            Email Address <span class="text-red-500">*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 focus:bg-white focus:border-orange-500 focus:ring-2 focus:ring-orange-100 outline-none"
                        >
                    </div>

                    <div class="form-group mb-5">
                        <label for="password" class="block text-sm font-semibold mb-2">
                            Password <span class="text-red-500">*</span>
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Your password"
                            required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 focus:bg-white focus:border-orange-500 focus:ring-2 focus:ring-orange-100 outline-none"
                        >
                    </div>

                    <div class="login-options flex items-center justify-between mb-7 text-sm">

                        <label class="flex items-center gap-2 text-gray-600">
                            <input
                                type="checkbox"
                                name="remember"
                                checked
                                class="w-4 h-4 accent-orange-500"
                            >
                            Remember me
                        </label>

                        <a href="#" class="text-orange-500 font-medium hover:underline">
                            Forgot password?
                        </a>

                    </div>

                    <button
                        type="submit"
                        class="login-btn w-full py-3.5 rounded-lg bg-amber-600 text-white font-semibold hover:bg-amber-700"
                    >
                        Log In to BlogHub
                    </button>

                </form>

                <hr class="my-7 border-gray-100">

                <p class="register-text text-center text-sm text-gray-500">
                    Don't have an account?
                    <a href="register.html" class="text-orange-500 font-semibold hover:underline">
                        Create one free
                    </a>
                </p>

            </div>

        </div>

    </main>
  </body>
</html>
