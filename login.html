<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - BlogHub</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/stylesheet.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <!-- Navbar -->
    <header class="site-header">
      <nav
        class="navbar flex items-center justify-between px-6 md:px-12 lg:px-16"
      >
        <!-- Logo -->
        <a href="index.html" class="logo flex items-center gap-3">
          <span class="logo-box"> B </span>

          <span class="logo-text"> BlogHub </span>
        </a>

        <!-- Navigation Links -->
        <div class="nav-links hidden md:flex items-center gap-10">
          <a href="index.html" class="active"> Home </a>

          <a href="explore.html"> Explore </a>
        </div>

        <!-- Login / Register -->
        <div class="nav-actions flex items-center gap-3">
          <a href="login.html" class="login-btn"> Login </a>

          <a href="register.html" class="register-btn"> Register </a>
        </div>
      </nav>
    </header>

    <!-- Login Page -->
    <main class="login-page">
      <div class="login-container">
        <div class="login-box">
          <div class="login-heading">
            <span class="login-label"> ✦ WELCOME BACK </span>

            <h1>Login to BlogHub</h1>

            <p>
              Continue reading, sharing and discovering stories that matter.
            </p>
          </div>

          <form action="#" method="POST">
            <div class="form-group">
              <label for="email"> Email Address </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="password"> Password </label>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="login-options">
              <label class="remember-me">
                <input type="checkbox" name="remember" />

                Remember me
              </label>

              <a href="#"> Forgot password? </a>
            </div>

            <button type="submit" class="login-submit">Login</button>
          </form>

          <p class="register-text">
            Don't have an account?

            <a href="register.html"> Register </a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
