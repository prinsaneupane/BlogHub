<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register - BlogHub</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/stylesheet.css" />
    <link rel="stylesheet" href="css/register.css" />
  </head>

  <body>
    <!-- Navbar -->
    <header class="site-header">
      <nav
        class="navbar flex items-center justify-between px-6 md:px-12 lg:px-16"
      >
        <!-- Logo -->
        <a href="index.html" class="logo flex items-center gap-3">
          <span class="logo-box"> B </span>

          <span class="logo-text"> BlogHub </span>
        </a>

        <!-- Navigation Links -->
        <div class="nav-links hidden md:flex items-center gap-10">
          <a href="index.html" class="active"> Home </a>

          <a href="explore.html"> Explore </a>
        </div>

        <!-- Login / Register -->
        <div class="nav-actions flex items-center gap-3">
          <a href="login.html" class="login-btn"> Login </a>

          <a href="register.html" class="register-btn"> Register </a>
        </div>
      </nav>
    </header>

    <!-- Register Section -->
    <main class="register-page">
      <div class="register-container">
        <div class="register-heading">
          <h1>Start your journey</h1>

          <p>Join BlogHub and share stories that matter to the world.</p>
        </div>

        <div class="register-box">
          <form action="#" method="POST">
            <div class="form-group">
              <label for="name"> Full Name <span>*</span> </label>

              <input
                type="text"
                id="name"
                name="name"
                placeholder="Your full name"
                required
              />
            </div>

            <div class="form-group">
              <label for="email"> Email Address <span>*</span> </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="password"> Password <span>*</span> </label>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Choose a strong password"
                required
              />
            </div>

            <div class="form-group">
              <label for="confirm-password">
                Confirm Password <span>*</span>
              </label>

              <input
                type="password"
                id="confirm-password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
              />
            </div>

            <button type="submit" class="register-submit">
              Create My Account
            </button>
          </form>

          <div class="register-divider"></div>

          <p class="login-text">
            Already have an account?
            <a href="login.html">Log in here</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
